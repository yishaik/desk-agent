# Desk Agent - Docker Compose Stack
# One stack per customer for security isolation
#
# Usage:
#   1. Copy .env.example to .env and configure
#   2. docker compose up -d
#   3. Open https://your-domain.com (or http://localhost if no DOMAIN set)
#   4. Enter your PAIR_TOKEN to authenticate
#   5. Scan QR code to pair WhatsApp

services:
  # Desk Agent - WhatsApp bot with AI
  agent:
    build: .
    container_name: desk-agent
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - HOST=0.0.0.0
      - PORT=3001
      - PAIR_TOKEN=${PAIR_TOKEN}
      - OPEN_CONNECTOR_URL=http://connector:3000
      - OPEN_CONNECTOR_TOKEN=${OPEN_CONNECTOR_TOKEN}
      - CONNECTOR_ORIGIN=${CONNECTOR_ORIGIN}
      - CONNECTOR_ADMIN_TOKEN=${CONNECTOR_ADMIN_TOKEN}
      - DOMAIN=${DOMAIN}
      - MODEL_API_KEY=${MODEL_API_KEY}
      - MODEL_API_URL=${MODEL_API_URL:-https://api.anthropic.com/v1/messages}
      - ANTHROPIC_API_KEY=${MODEL_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - agent-data:/app/data
    depends_on:
      - connector
    networks:
      - desk-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Open Connector - Auth gateway for SaaS apps
  # Built from yishaik/open-connector fork (has token-grant + action-policy features)
  connector:
    build:
      context: https://github.com/yishaik/open-connector.git
      dockerfile: docker/Dockerfile
    # Alternative: clone locally and use local path:
    # build:
    #   context: ../open-connector
    #   dockerfile: docker/Dockerfile
    container_name: desk-connector
    restart: unless-stopped
    environment:
      - OOMOL_CONNECT_DATA_DIR=/app/data
      - OOMOL_CONNECT_ORIGIN=${CONNECTOR_ORIGIN:-http://localhost:3000}
      - OOMOL_CONNECT_ENCRYPTION_KEY=${CONNECTOR_ENCRYPTION_KEY}
      - OOMOL_CONNECT_ADMIN_TOKEN=${CONNECTOR_ADMIN_TOKEN}
      - OOMOL_CONNECT_RUNTIME_TOKEN=${OPEN_CONNECTOR_TOKEN}
      - OOMOL_CONNECT_ALLOWED_ACTIONS=${CONNECTOR_ALLOWED_ACTIONS:-*}
      - OOMOL_CONNECT_BLOCKED_ACTIONS=${CONNECTOR_BLOCKED_ACTIONS:-}
    volumes:
      - connector-data:/app/data
    networks:
      - desk-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Caddy - Reverse proxy with automatic HTTPS
  caddy:
    image: caddy:2-alpine
    container_name: desk-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - agent
      - connector
    networks:
      - desk-network

volumes:
  agent-data:
    name: desk-agent-data
  connector-data:
    name: desk-connector-data
  caddy-data:
    name: desk-caddy-data
  caddy-config:
    name: desk-caddy-config

networks:
  desk-network:
    name: desk-network
